<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Fire & Smoke Monitoring System
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #1c1c1c;
        }

        h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .camera-box {
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        video,
        #resultImage {
            width: 100%;
            display: block;
        }

        #resultImage {
            display: none;
        }

        button {
            margin: 20px 0;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .status {
            background: #1c1c1c;
            margin-top: 20px;
            padding: 25px;
            border-radius: 12px;
        }

        #detection {
            font-size: 24px;
            font-weight: bold;
        }

        .safe {
            color: #00ff88;
        }

        .danger {
            color: #ff3333;
        }

        #confidence {
            margin-top: 10px;
            font-size: 18px;
        }

    </style>

</head>


<body>

    <header>

        <h1>
            🔥 Automated Fire & Smoke Monitoring System
        </h1>

        <p>
            YOLOv8 Vision-Based Detection
        </p>

    </header>


    <div class="container">

        <button id="startButton">
            📷 Start Camera
        </button>


        <div class="camera-box">

            <video
                id="video"
                autoplay
                playsinline
                muted>
            </video>

            <img
                id="resultImage"
                alt="Detection result">

        </div>


        <canvas
            id="canvas"
            style="display:none;">
        </canvas>


        <div class="status">

            <div
                id="detection"
                class="safe">

                Camera not started

            </div>

            <div id="confidence">

                Confidence: --

            </div>

        </div>

    </div>


    <script>

        const video =
            document.getElementById("video");

        const canvas =
            document.getElementById("canvas");

        const resultImage =
            document.getElementById("resultImage");

        const startButton =
            document.getElementById("startButton");

        const detection =
            document.getElementById("detection");

        const confidence =
            document.getElementById("confidence");


        let stream = null;

        let detecting = false;


        startButton.addEventListener(
            "click",
            startCamera
        );


        async function startCamera() {

            try {

                stream =
                    await navigator.mediaDevices
                    .getUserMedia({
                        video: true,
                        audio: false
                    });

                video.srcObject = stream;

                detection.innerText =
                    "✅ Camera started";

                detection.className =
                    "safe";

                startButton.innerText =
                    "📷 Camera Running";

                startButton.disabled =
                    true;

                video.style.display =
                    "block";

                resultImage.style.display =
                    "none";

                detecting = true;

                detectFrame();

            }

            catch (error) {

                console.error(error);

                detection.innerText =
                    "❌ Camera permission denied";

                detection.className =
                    "danger";

                confidence.innerText =
                    "Please allow camera access.";

            }

        }


        async function detectFrame() {

            if (!detecting) {
                return;
            }


            if (video.readyState < 2) {

                setTimeout(
                    detectFrame,
                    500
                );

                return;

            }


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const context =
                canvas.getContext("2d");


            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            const image =
                canvas.toDataURL(
                    "image/jpeg",
                    0.7
                );


            try {

                const response =
                    await fetch(
                        "/detect",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                image: image
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    console.error(
                        data.error
                    );

                    setTimeout(
                        detectFrame,
                        1000
                    );

                    return;

                }


                // Show annotated image

                if (data.image) {

                    resultImage.src =
                        data.image;

                    resultImage.style.display =
                        "block";

                    video.style.display =
                        "none";

                }


                // Detection result

                if (
                    data.detections &&
                    data.detections.length > 0
                ) {

                    const first =
                        data.detections[0];


                    detection.innerText =
                        "🚨 " + first.type;

                    detection.className =
                        "danger";


                    confidence.innerText =
                        "Confidence: "
                        + first.confidence
                        + "%";

                }

                else {

                    detection.innerText =
                        "✅ No Fire / Smoke Detected";

                    detection.className =
                        "safe";

                    confidence.innerText =
                        "Confidence: --";

                }

            }

            catch (error) {

                console.error(
                    "Detection error:",
                    error
                );

            }


            // Run again

            setTimeout(
                detectFrame,
                500
            );

        }

    </script>

</body>

</html>
